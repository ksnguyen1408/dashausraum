<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Quản Lý Tài Chính & Công Nợ - Dashaus & Raum</title>
<style>
  :root {
    --bg-primary: #f8fafc;
    --bg-surface: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --brand-dashaus: #2563eb;
    --brand-raum: #059669;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --radius: 8px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  }

  [data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    line-height: 1.5;
  }

  /* App Layout */
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .appbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem; background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
  }
  .stage { flex: 1; padding: 1.5rem; overflow-y: auto; }

  /* Utilities */
  .badge-dashaus { background: var(--brand-dashaus); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .badge-raum { background: var(--brand-raum); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .btn { padding: 8px 16px; border-radius: var(--radius); border: none; cursor: pointer; font-weight: 500; }
  .btn-primary { background: var(--brand-dashaus); color: white; }

  /* Print Styles */
  @media print {
    .appbar, .rail, .doc-actions, .alert-strip, .ai-panel, .toast, .no-print { display: none !important; }
    .app { display: block !important; min-height: auto !important; }
    .stage { padding: 0 !important; overflow: visible !important; }
    .sheet {
      box-shadow: none !important;
      border: none !important;
      width: 100% !important;
      max-width: 100% !important;
      padding: 0 !important;
      page-break-inside: avoid;
    }
    .sheet::before { display: none !important; }
  }
</style>
</head>
<body>
  <div id="appRoot">
    <div class="app">
      <header class="appbar">
        <h2>Hệ Thống Quản Lý Tài Chính & Công Nợ</h2>
        <div>
          <span class="badge-dashaus">Dashaus</span>
          <span class="badge-raum">Raum</span>
        </div>
      </header>
      <main class="stage">
        <div class="sheet">
          <p>Hệ thống đã sẵn sàng. Giao diện và dữ liệuRuntime sẽ được khởi tạo tại đây.</p>
        </div>
      </main>
    </div>
  </div>

  <script>
    // System Runtime & Utilities
    window.addEventListener('DOMContentLoaded', () => {
      console.log('App initialized successfully.');
    });
  </script>
</body>
</html>
